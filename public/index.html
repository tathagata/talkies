<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talkies</title><link rel="stylesheet" href="style.css"></head><body>
<header><b class="logo">talkies<span>.</span></b><input id="title" aria-label="Talk title"><span id="saved">Loading…</span><button id="settings">Settings</button><button id="git">Review & commit</button><button id="export">Export</button><button id="publish" class="primary">Publish</button></header>
<div class="shell"><aside><div class="eyebrow">TALK OUTLINE</div><div id="outline"></div><button id="add">+ Add slide</button><div class="aside-bottom">Local workspace<br><span id="privacy"></span></div></aside><main><div class="toolbar"><strong id="selected"></strong><span class="grow"></span><button id="up" aria-label="Move slide up">↑</button><button id="down" aria-label="Move slide down">↓</button><button id="delete">Delete</button><button id="rehearse">Rehearse</button></div><div class="work"><section class="panel"><div class="label">Slide Markdown <small>Marp · HTML enabled</small></div><textarea id="markdown" spellcheck="false" aria-label="Slide Markdown"></textarea><label class="upload">Add image <input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label></section><section class="panel"><div class="label">Live preview <small>16:9</small></div><iframe id="preview" title="Slide preview" sandbox=""></iframe></section></div><div class="notes"><section class="panel thought"><label class="label" for="thoughts">Thought process <small>Preparation only</small></label><textarea id="thoughts"></textarea></section><section class="panel"><label class="label" for="narrative">Narrative <small id="timing"></small></label><textarea id="narrative"></textarea></section></div><section class="panel context"><div class="tabs"><button data-tab="ai" class="active">AI workspace</button><button data-tab="sources">Research</button><button data-tab="issues">Issues</button></div><div id="context"></div></section></main></div><footer><span id="status" role="status" aria-live="polite">Ready</span><span>⌘/Ctrl S · Save</span></footer><dialog id="dialog"><div id="dialog-body"></div><button id="close">Close</button></dialog><script type="module" src="app.js"></script></body></html>
